name: DMoney Playwright Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'DMoney Automation/**'
      - '.github/workflows/dmoney-playwright.yml'

  pull_request:
    branches: [main, master]
    paths:
      - 'DMoney Automation/**'
      - '.github/workflows/dmoney-playwright.yml'

  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DMoney Automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: 'DMoney Automation/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          Gmail_Access_Token: ${{ secrets.GMAIL_ACCESS_TOKEN }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dmoney-playwright-report
          path: 'DMoney Automation/playwright-report/'
          retention-days: 30