name: DMoney Playwright Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'DMoney Automation/**'
      - '.github/workflows/dmoney-playwright.yml'

  pull_request:
    branches: [main, master]
    paths:
      - 'DMoney Automation/**'
      - '.github/workflows/dmoney-playwright.yml'

  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: DMoney Automation

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'DMoney Automation/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Check DMoney website
        run: |
          echo "Checking DMoney website..."

          curl -L --max-time 30 \
            https://dmoneyportal.roadtocareer.net \
            -o dmoney-response.html

          echo "Checking response..."

          grep -i -E "Just a moment|Cloudflare|DMoney" \
            dmoney-response.html || true

      - name: Run Playwright tests
        run: npx playwright test
        env:
          Gmail_Access_Token: ${{ secrets.GMAIL_ACCESS_TOKEN }}
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dmoney-playwright-report
          path: 'DMoney Automation/playwright-report/'
          retention-days: 30

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dmoney-playwright-test-results
          path: 'DMoney Automation/test-results/'
          retention-days: 30
